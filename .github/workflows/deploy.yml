name: FTP Deploy

on:
  push:
    branches:
      - main
  # 手動実行は常にdry-run（変更内容をログに出すだけで、サーバーは変更しない）
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to FTP Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.lolipop.jp
          username: frenchkiss.jp-angels-healing
          password: ${{ secrets.FTP_PASSWORD }}
          # 手動実行(workflow_dispatch)のときだけdry-run。push(main)は通常デプロイ
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          # 状態ファイルは .htaccess の「ドット始まりのファイル拒否」で外部から見えなくする
          exclude: |
            **/.git*
            **/.git*/**
            **/.vscode*
            **/.vscode*/**
            **/.env
            **/composer.*
            **/*.md
            **/start-server.cmd
            **/.github*
            **/.github*/**
            **/tests
            **/tests/**
